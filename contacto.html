<!DOCTYPE html>
<html>
  <head>
   <meta charset="utf-8" />
   <title>A&W Tienda de Ropa</title>
   <link rel="stylesheet" href="estilos.css" />
  </head>
  
  <body>
	  
	  <div class="image-banner-container">
        <img src="img/banner.png" alt="A&W Promoción" class="image-banner">
      </div>
	  
    <div id="container">

      <header>
        <h1>Contacto</h1>
      </header>

     <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
         
        </ul>
      </nav>

      <div class="clearfix"></div>
      
    <section id="content">
         <h2 style="text-align: center; margin-bottom: 30px; text-transform: uppercase; font-size: 20px;">Envíanos un mensaje</h2>
         
         <form class="formulario-contacto">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ej. Williams">

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="tu@correo.com">

            <label for="mensaje">Tu mensaje</label>
            <textarea id="mensaje" placeholder="¿En qué te podemos ayudar?"></textarea>

            <button type="submit" class="btn-comprar">Enviar Mensaje</button>
         </form>
      </section>

      <aside>
        <h2>Buscador</h2>
        <form>
          <input type="text" placeholder="Buscar prenda...">
          <input type="submit" value="Buscar" />
        </form>
        <br>
        
        <h2>Categorías</h2>
        <ul class="menu-lateral">
          <li><a href="vestidos.html">Vestidos</a></li>
          <li><a href="pantalones.html">Pantalones</a></li>
          <li><a href="blusas.html">Blusas</a></li>
          <li><a href="faldas.html">Faldas</a></li>
          <li><a href="chamarras.html">Chamarras</a></li>
          <li><a href="accesorios.html">Accesorios</a></li>
        </ul>

        <br><br>
        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">
        <h2>Tu Carrito</h2>
        
        <ul id="lista-carrito" style="margin-bottom: 15px; font-size: 13px; color: #555;">
          <li>El carrito está vacío</li>
        </ul>
        
        <p style="font-size: 14px; color: #000; margin-bottom: 15px;">
          <strong>Total: $<span id="total-carrito">0</span> MXN</strong>
        </p>

        <button onclick="vaciarCarrito()" style="background: transparent; border: 1px solid #cc0000; color: #cc0000; padding: 8px 0; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 11px; font-weight: bold; transition: 0.3s;">
          Vaciar Carrito
        </button>

      </aside>

      <div class="clearfix"></div>

		<a id="btn-whatsapp" href="#" target="_blank" style="display:none; position:fixed; bottom:30px; right:30px; background:#25D366; color:white; padding:15px 25px; text-decoration:none; border-radius:50px; font-weight:bold; font-family:Arial; box-shadow: 0px 4px 10px rgba(0,0,0,0.2); transition: transform 0.3s;">
        🛒 Pagar Pedido en WhatsApp
      </a>
		
      <footer>
        Proyecto final WEB &copy; 2026 - Williams
      </footer>

    </div>
	  
	  <script>
      // 1. En lugar de empezar en 0, leemos la "libreta" (localStorage). 
      // JSON.parse traduce el texto guardado de vuelta a código que la página entienda.
      let carrito = JSON.parse(localStorage.getItem('miCarritoAW')) || [];
      let total = parseFloat(localStorage.getItem('miTotalAW')) || 0;
      
      let miNumeroDeWhatsApp = "526640000000"; 

      // 2. Esta función arranca solita cada vez que abres CUALQUIER página
      function inicializarPagina() {
          actualizarCarritoVisual();
          if(carrito.length > 0) {
              prepararWhatsApp(); // Si hay algo en la memoria, mostramos el botón
          }
      }

      function agregarAlCarrito(nombrePrenda, precioPrenda) {
          carrito.push({ nombre: nombrePrenda, precio: precioPrenda });
          total = total + precioPrenda;

          // GUARDAR EN LA MEMORIA (Anotamos en la libreta)
          localStorage.setItem('miCarritoAW', JSON.stringify(carrito));
          localStorage.setItem('miTotalAW', total);

          actualizarCarritoVisual();
          prepararWhatsApp();
      }

      function actualizarCarritoVisual() {
          let listaHTML = document.getElementById("lista-carrito");
          let totalHTML = document.getElementById("total-carrito");

          if (!listaHTML || !totalHTML) return; // Evita errores si la barra lateral no ha cargado

          listaHTML.innerHTML = "";

          if (carrito.length === 0) {
              listaHTML.innerHTML = "<li>El carrito está vacío</li>";
          } else {
              for (let i = 0; i < carrito.length; i++) {
                  let item = carrito[i];
                  listaHTML.innerHTML += "<li style='display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #c97a8e; padding-bottom: 4px;'>" + 
                                         "<span>" + item.nombre + "</span>" + 
                                         "<span>$" + item.precio + "</span>" + 
                                         "</li>";
              }
          }
          totalHTML.innerText = total;
      }

      function vaciarCarrito() {
          carrito = [];
          total = 0;

          // BORRAMOS LA MEMORIA
          localStorage.removeItem('miCarritoAW');
          localStorage.removeItem('miTotalAW');

          actualizarCarritoVisual();
          document.getElementById("btn-whatsapp").style.display = "none";
      }

      function prepararWhatsApp() {
          let textoMensaje = "Hola A&W, me gustaría pedir lo siguiente:\n\n";
          for (let i = 0; i < carrito.length; i++) {
              let item = carrito[i];
              textoMensaje += "- " + item.nombre + " ($" + item.precio + ")\n";
          }
          textoMensaje += "\n*Total estimado: $" + total + " MXN*";

          let textoCodificado = encodeURIComponent(textoMensaje);
          let enlaceFinal = "https://wa.me/" + miNumeroDeWhatsApp + "?text=" + textoCodificado;

          let botonWpp = document.getElementById("btn-whatsapp");
          if(botonWpp) {
              botonWpp.href = enlaceFinal;
              botonWpp.style.display = "block";
          }
      }

      // Ejecutamos la función de arranque justo cuando carga el script
      inicializarPagina();
    </script>
	  
	  
  </body>
</html>
